<div class="history-container">
  <h2>Prediction History</h2>

  <div class="table-wrapper">
    <table class="history-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>Time</th>
          <th>File Name</th>
          <th>Result</th>
          <th>Confidence</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of history">
          <td>{{ item.timestamp | date:'yyyy-MM-dd' }}</td>
          <td>{{ item.timestamp | date:'HH:mm' }}</td>
          <td>{{ item.filename }}</td>
          <td>
            <span class="result" [ngClass]="{'real': item.label === 'Real', 'fake': item.label === 'Fake'}">
              {{ item.label === 'Real' ? '🟢 Real' : '🔴 Fake' }}
            </span>
          </td>
          <td>{{ item.confidence }}</td>
          <td>
            <button (click)="deleteItem(item.id)" class="delete-btn">ลบ</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
